name: Gym Tracker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  frontend-check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      - name: Build frontend
        working-directory: frontend
        run: npm run build


  backend-check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install backend dependencies
        working-directory: backend
        run: npm ci


      - name: Backend syntax check
        working-directory: backend
        run: node --check server.js


  docker:

    needs:
      - frontend-check
      - backend-check

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/gym-tracker-api:latest \
          ./backend


      - name: Push Docker image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/gym-tracker-api:latest